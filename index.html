<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/paulo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAULO® | Handcrafted Jewelry — Official Site</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      .loading {
          width: 100%;
          height: 100vh;
          overflow: hidden;
          background-color: #1b1b1b;
      }

      .spinnerDiv {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
      }

      .spinner {
          min-width: 50px;
          color: white;
          min-height: 50px;
          transform: translateZ(0);
          animation: spin 3s linear infinite;
      }

      @keyframes spin {
          from {
              transform: rotate(0deg);
          }

          to {
              transform: rotate(360deg);
          }
          
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="spinnerDiv">
          <img src="/loader.svg" class="spinner">
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
